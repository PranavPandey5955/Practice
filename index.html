<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>To-Do List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>To-do</h1>
    <p id="count" aria-live="polite"></p>
  </header>

  <form id="form">
    <input id="newTask" type="text" placeholder="What needs doing?" autocomplete="off" maxlength="200" aria-label="New task">
    <button class="add" type="submit">Add task</button>
  </form>

  <div class="filters" role="group" aria-label="Filter tasks">
    <button type="button" data-filter="all" aria-pressed="true">All</button>
    <button type="button" data-filter="active" aria-pressed="false">To do</button>
    <button type="button" data-filter="done" aria-pressed="false">Done</button>
  </div>

  <ul id="list"></ul>
  <footer><button id="clear" type="button" hidden>Clear completed</button></footer>
</main>

<script src="script.js"></script>
</body>
</html>
